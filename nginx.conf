user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;

    # ============================================================================
    # FD-Sales Single Page Application (SPA) Server Configuration
    # التكوين لتطبيق صفحة واحدة مع معالجة التوجيه وأمان الرؤوس
    # ============================================================================

    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # ========== SECURITY HEADERS ==========
        # رؤوس الأمان لحماية التطبيق من الهجمات الشائعة
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.fingerprintjs.com" always;

        # ========== SPA ROUTING ==========
        # معالجة التوجيه للتطبيق - جميع الطلبات التي لم تطابق ملف فعلي
        # يتم توجيهها إلى index.html لمعالجة التوجيه من جانب العميل
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ========== STATIC ASSETS CACHING ==========
        # تخزين مؤقت للملفات الثابتة (JS, CSS, الصور)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ========== API PROXY ==========
        # توجيه طلبات API إلى Supabase (إذا لزم الأمر)
        location /api/ {
            proxy_pass https://api.supabase.co/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========== HEALTH CHECK ==========
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # ========== ERROR PAGES ==========
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}
